[build]
  publish = "."
  command = "echo 'No build needed - catalog.json is prebuilt'"

[build.environment]
  NODE_VERSION = "20"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "*.apk"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Content-Type = "application/vnd.android.package-archive"

[[headers]]
  for = "/m/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# --- API routes ---

# /api/manifest is what index.html fetches - serve catalog.json
[[redirects]]
  from = "/api/manifest"
  to = "/catalog.json"
  status = 200
  force = true

# /vendor/qrcode.mjs -> flat layout has qrcode.mjs in root
[[redirects]]
  from = "/vendor/qrcode.mjs"
  to = "/qrcode.mjs"
  status = 200
  force = true

[[redirects]]
  from = "/vendor/*"
  to = "/:splat"
  status = 200
  force = true

# --- Download mirroring ---
# True mirror via Edge Function (enabled by default so China users never hit blocked github.com directly)
# Fallback redirect uses ghfast.top CDN if edge function is bypassed
[[redirects]]
  from = "/m/*"
  to = "https://ghfast.top/https://github.com/:splat"
  status = 302
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Edge Functions declarations
[[edge_functions]]
  path = "/healthz"
  function = "healthz"

[[edge_functions]]
  path = "/m/*"
  function = "mirror"
